<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="StayPass · Tu habitación sin esperas ni preguntas">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="StayPass">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>StayPass · Acceso Inteligente</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      background-color: #141312;
      color: #F3EFEA;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #loading-indicator {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 9999;
      pointer-events: none;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(213, 179, 153, 0.25);
      border-top-color: #D5B399;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading-indicator">
    <div class="spinner"></div>
    <div style="font-size:14px;font-weight:600;color:#A69F98;">Cargando StayPass...</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function() {
      var el = document.getElementById('loading-indicator');
      if (el) el.remove();
    });
    setTimeout(function() {
      var el = document.getElementById('loading-indicator');
      if (el) el.remove();
    }, 6000);
  </script>
  <script src="flutter_bootstrap.js?v=20261120" async></script>
</body>
</html>
