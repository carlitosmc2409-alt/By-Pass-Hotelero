<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>By Pass Hotelero API — StayPass</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 36px;
      max-width: 540px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .dot {
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
    }
    h1 {
      margin: 16px 0 8px;
      font-size: 1.75rem;
      color: #ffffff;
    }
    p {
      color: #94a3b8;
      line-height: 1.6;
      margin: 8px 0 20px;
    }
    .endpoints {
      background: #0f172a;
      border-radius: 8px;
      padding: 16px;
      font-family: monospace;
      font-size: 0.9rem;
      border: 1px solid #1e293b;
    }
    .endpoint-item {
      display: flex;
      justify-content: space-between;
      margin: 6px 0;
      color: #cbd5e1;
    }
    .method {
      color: #38bdf8;
      font-weight: bold;
    }
    a {
      color: #38bdf8;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <span class="dot"></span> Sistema Activo en la Nube
    </div>
    <h1>By Pass Hotelero (StayPass)</h1>
    <p>Servidor API REST y Motor de Control de Acceso Biométrico / QR con base de datos en Supabase y despliegue continuo en Vercel.</p>
    
    <div class="endpoints">
      <div class="endpoint-item">
        <span class="method">GET</span>
        <a href="/health">/health</a>
      </div>
      <div class="endpoint-item">
        <span class="method">GET</span>
        <a href="/api/v1/rooms">/api/v1/rooms</a>
      </div>
      <div class="endpoint-item">
        <span class="method">GET</span>
        <a href="/api/v1/hotels/motel-la-brisa-caracas">/api/v1/hotels/...</a>
      </div>
    </div>
  </div>
</body>
</html>
